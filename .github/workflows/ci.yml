name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout MsxAudio dependency
        uses: actions/checkout@v4
        with:
          repository: wagenheimer/MsxAudio
          path: lib/MsxAudio

      - name: Checkout MonoGameHelper dependency
        uses: actions/checkout@v4
        with:
          repository: wagenheimer/MonoGameHelper
          path: lib/MonoGameHelper

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          include-prerelease: true

      - name: Restore local tools
        run: dotnet tool restore

      - name: Restore dependencies
        run: dotnet restore KingsValley.slnx

      - name: Build solution
        run: dotnet build KingsValley.slnx -c Release --no-restore

      - name: Run unit tests
        run: dotnet test KingsValley.slnx -c Release --no-build --verbosity normal
